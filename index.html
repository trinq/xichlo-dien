<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XÍCH LÔ ĐIÊN</title>
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: none;
    }
    #hud > * { pointer-events: auto; }
    #hud-top-left {
      position: absolute; top: 16px; left: 16px;
      background: rgba(0,0,0,0.6); padding: 8px 12px;
      border-radius: 4px; font-size: 14px;
    }
    #hp-bar-bg {
      width: 200px; height: 16px; background: #333;
      border: 1px solid #666; border-radius: 2px; overflow: hidden;
    }
    #hp-bar-fill {
      width: 100%; height: 100%; background: #4f4;
      transition: width 0.2s;
    }
    #hud-top-right {
      position: absolute; top: 16px; right: 16px;
      background: rgba(0,0,0,0.6); padding: 8px 12px;
      border-radius: 4px; font-size: 14px;
    }
    #hud-message {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8); padding: 24px 48px;
      border-radius: 8px; font-size: 32px; font-weight: bold;
      display: none; text-align: center; line-height: 1.4;
    }
    #menu {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100;
    }
    #menu h1 {
      font-size: 72px; margin: 0 0 16px; letter-spacing: 4px;
      color: #ffeb3b; text-shadow: 0 4px 0 #c62828, 0 8px 16px rgba(0,0,0,0.5);
    }
    #menu .intro {
      font-size: 18px; max-width: 600px; text-align: center;
      color: #fff; margin-bottom: 48px; opacity: 0.85;
      padding: 0 24px;
    }
    #menu button {
      padding: 16px 48px; font-size: 24px; font-weight: bold;
      background: #ffeb3b; color: #000; border: none;
      border-radius: 8px; cursor: pointer; letter-spacing: 2px;
      box-shadow: 0 4px 0 #c62828;
    }
    #menu button:hover { background: #fff59d; }
    #menu button:active { transform: translateY(2px); box-shadow: 0 2px 0 #c62828; }
    #fps {
      position: fixed; top: 4px; right: 4px;
      background: rgba(0,0,0,0.5); padding: 2px 6px;
      font-size: 11px; font-family: monospace; color: #0f0;
      pointer-events: none; z-index: 200;
    }
  </style>
</head>
<body>
  <div id="menu">
    <h1>XÍCH LÔ ĐIÊN</h1>
    <p class="intro">Bạn là tay đua xích lô cuối cùng của Sài Gòn. Đụng xe địch → vào arena. Sống sót → mua xe mạnh hơn → đi tiếp.</p>
    <button id="start-btn">BẮT ĐẦU</button>
  </div>

  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div id="hud-top-left">
      <div>HP</div>
      <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div>
      <div id="hp-text" style="margin-top:4px;">100 / 100</div>
    </div>
    <div id="hud-top-right">
      <div>ĐÃ HẠ</div>
      <div id="kills-text" style="font-size:24px; font-weight:bold; margin-top:4px;">0 / 3</div>
    </div>
    <div id="hud-message"></div>
  </div>

  <div id="fps">FPS: --</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
